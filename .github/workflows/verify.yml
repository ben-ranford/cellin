name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --dev --frozen

      - name: Validate feature release lock
        run: |
          python -m uv run python - <<'PY'
          from cellin.features.resolver import read_release_lock_document

          document = read_release_lock_document("features.release.lock.json")
          print(f"validated_feature_lock={len(document['defaultOn'])}")
          PY

      - name: Run CI target (verify + docs + version-check)
        run: make ci

      - name: Upload smoke eval report
        if: always() && hashFiles('eval-results/smoke.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: smoke-eval-report
          path: eval-results/smoke.json

  package-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --dev --frozen

      - name: Run package smoke
        run: make package-smoke

      - name: Upload built artifacts
        if: always() && hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: package-smoke-dist
          path: dist/*

  docker-mcp:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build MCP Docker image
        run: docker build -t cellin-mcp:ci .

      - name: Run MCP startup check
        run: docker run --rm cellin-mcp:ci --check

  storage-defaults:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: in-memory
            selector: test_cli_storage_init_dry_run_reports_default_in_memory_preset
          - label: sqlite
            selector: test_cli_storage_init_initializes_sqlite_and_records_trace

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --dev --frozen

      - name: Run storage default coverage (${{ matrix.label }})
        run: python -m uv run pytest -q tests/integration/cli/test_storage_cli.py -k "${{ matrix.selector }}"

  nightly-evals:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --dev --frozen

      - name: Run full eval suite
        run: make eval-full

      - name: Upload full eval report
        uses: actions/upload-artifact@v7
        with:
          name: full-eval-report
          path: eval-results/full.json

  nightly-storage-backends:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: relational
            extra_args: --extra sql-backends
            pytest_targets: tests/contracts/test_storage.py tests/integration/stores/test_sql_backends.py
          - label: graph
            extra_args: --extra graph-backends
            pytest_targets: tests/contracts/test_storage.py tests/integration/stores/test_graph_backends.py
          - label: vector
            extra_args: --extra vector-backends
            pytest_targets: tests/contracts/test_storage.py tests/integration/stores/test_pgvector.py tests/integration/stores/test_remote_vector_backends.py

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies for ${{ matrix.label }}
        run: python -m uv sync --dev --frozen ${{ matrix.extra_args }}

      - name: Run backend coverage (${{ matrix.label }})
        run: python -m uv run pytest -q ${{ matrix.pytest_targets }}
