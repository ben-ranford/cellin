name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --dev

      - name: Run CI target
        run: make ci

      - name: Upload smoke eval report
        if: always() && hashFiles('eval-results/smoke.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-report
          path: eval-results/smoke.json

  nightly-evals:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: python -m uv sync --dev

      - name: Run full eval suite
        run: make eval-full

      - name: Upload full eval report
        uses: actions/upload-artifact@v4
        with:
          name: full-eval-report
          path: eval-results/full.json
