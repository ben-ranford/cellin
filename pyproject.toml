[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "cellin"
dynamic = ["version"]
description = "Build long-lived multimodal memory, dream over it, and retrieve context with transparent weighting."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Ben Ranford" }]
keywords = ["memory", "retrieval", "multimodal", "agents", "evals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
cellin = "cellin.cli:main"

[project.urls]
Documentation = "https://github.com/ben-ranford/cellin/tree/main/docs"
Issues = "https://github.com/ben-ranford/cellin/issues"
Releases = "https://github.com/ben-ranford/cellin/releases"
Source = "https://github.com/ben-ranford/cellin"

[dependency-groups]
dev = [
  "build>=1.2.2.post1",
  "lefthook>=1.7.15",
  "mkdocs-material>=9.5.34",
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "pytest-cov>=7.0.0",
  "ruff>=0.6.9",
  "twine>=6.1.0",
]

[project.optional-dependencies]
duckdb = ["duckdb"]
document-cache-backends = ["pymongo", "redis"]
graph-backends = ["neo4j", "python-arango"]
arangodb = ["python-arango"]
milvus = ["pymilvus"]
mcp = ["mcp>=1.0"]
mongodb = ["pymongo"]
memgraph = ["neo4j"]
mysql = ["mysql-connector-python"]
neo4j = ["neo4j"]
pgvector = ["psycopg"]
storage-backends = [
  "duckdb",
  "psycopg",
  "mysql-connector-python",
  "pymongo",
  "redis",
  "neo4j",
  "python-arango",
  "pinecone",
  "qdrant-client",
  "weaviate-client",
  "pymilvus",
]
pinecone = ["pinecone"]
postgresql = ["psycopg"]
qdrant = ["qdrant-client"]
redis = ["redis"]
redis-vector = ["redis"]
sql-backends = ["duckdb", "psycopg", "mysql-connector-python"]
vector-backends = ["psycopg", "pinecone", "qdrant-client", "weaviate-client", "pymilvus", "redis"]
weaviate = ["weaviate-client"]

[tool.hatch.build.targets.wheel]
packages = ["src/cellin"]

[tool.hatch.version]
path = "src/cellin/__about__.py"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["cellin"]
strict = true
warn_unused_configs = true
